name: Build and Release Android APK

on:
  push:
    paths:
      - "uploads/**.zip"
      - "uploads/**.tar.gz"
      - "uploads/**.tgz"
      - "uploads/**.tar"
  workflow_dispatch:
    inputs:
      archive_path:
        description: "Optional source archive path, for example uploads/NetScope-source.zip"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    env:
      JAVA_VERSION: "17"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Select uploaded source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.archive_path }}"
          if [[ -n "$requested" ]]; then
            archive="$requested"
          else
            mapfile -t archives < <(find uploads -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' \) -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
            if [[ "${#archives[@]}" -eq 0 ]]; then
              echo "No source archive found in uploads/." >&2
              exit 1
            fi
            archive="${archives[0]}"
          fi
          [[ -f "$archive" ]] || { echo "Archive not found: $archive" >&2; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $archive"

      - name: Extract and normalize Android source
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          DEST_DIR: android
        run: bash scripts/prepare-android-source.sh

      - name: Restore fixed signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myipcheck-release.keystore"
          chmod 600 "$RUNNER_TEMP/myipcheck-release.keystore"

      - name: Calculate release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 1000+ keeps the first automated package newer than the existing v1 debug APK.
          version_code=$((1000 + RUN_NUMBER))
          version_name="1.0.${RUN_NUMBER}"
          tag="v${version_name}"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag (versionCode $version_code)"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/myipcheck-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PsigningStoreFile="$KEYSTORE_FILE" \
            -PsigningStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD"

      - name: Verify APK signature and package metadata
        id: apk
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$apk"
          mkdir -p "$RUNNER_TEMP/release"
          output="$RUNNER_TEMP/release/myipcheck-android-${VERSION_NAME}.apk"
          cp "$apk" "$output"
          echo "apk=$output" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK: ${{ steps.apk.outputs.apk }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          set -euo pipefail
          title="MyIPCheck Android ${VERSION_NAME}"
          notes="Automated Android release built from ${ARCHIVE}.\n\nThis is an independent Android app based on the public MyIP/IPCheck.ing feature architecture."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes "$notes"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$title" --notes "$notes" --latest
          fi
